<!DOCTYPE html>
<html lang="{{ lang or 'vi' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% if lang == 'ja' %}ログイン | Tokuyama ITAM
    {% elif lang == 'en' %}Sign In | Tokuyama Vietnam ITAM
    {% else %}Đăng nhập | Tokuyama ITAM
    {% endif %}
  </title>
  <link rel="stylesheet" href="/static/css/swiss_theme.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      box-sizing: border-box;
    }
    .login-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin: 16px 0 4px 0;
    }
    .login-sub {
      font-size: 13px;
      color: #64748b;
      margin: 0;
    }
    .login-field {
      margin-bottom: 18px;
    }
    .login-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .login-input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.15s ease;
    }
    .login-input:focus {
      background: #ffffff;
      border-color: #005bac;
      box-shadow: 0 0 0 3px rgba(0, 91, 172, 0.12);
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: #005bac;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      margin-top: 6px;
    }
    .login-btn:hover {
      background: #004b8d;
    }
    .login-btn:active {
      transform: scale(0.99);
    }
    .login-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .login-lang-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
      font-size: 12px;
    }
    .login-lang-link {
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .login-lang-link:hover, .login-lang-link.active {
      color: #005bac;
      font-weight: 700;
    }
    .login-footer-text {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <!-- Minimalist Header with Tokuyama Logo -->
      <div class="login-header">
        <img src="/static/img/logo.png" alt="Tokuyama Logo" style="height: 38px; width: auto; max-width: 210px; object-fit: contain; margin-bottom: 8px; display: inline-block;">
        <h1 class="login-title">
          {% if lang == 'ja' %}IT資産管理システム
          {% elif lang == 'en' %}IT Asset Management
          {% else %}Đăng nhập hệ thống ITAM
          {% endif %}
        </h1>
        <p class="login-sub">Tokuyama Vietnam Co., Ltd.</p>
      </div>

      {% if error %}
      <div class="login-error">
        {{ error }}
      </div>
      {% endif %}

      <!-- Pure Minimalist Login Form -->
      <form method="post" action="/login">
        <div class="login-field">
          <label class="login-label">
            {% if lang == 'ja' %}ユーザー名{% elif lang == 'en' %}Username{% else %}Tên đăng nhập{% endif %}
          </label>
          <input type="text" name="username" required autofocus class="login-input" placeholder="{% if lang == 'ja' %}ユーザー名を入力{% elif lang == 'en' %}Enter username{% else %}Nhập tên đăng nhập{% endif %}">
        </div>

        <div class="login-field" style="margin-bottom: 24px;">
          <label class="login-label">
            {% if lang == 'ja' %}パスワード{% elif lang == 'en' %}Password{% else %}Mật khẩu{% endif %}
          </label>
          <input type="password" name="password" required class="login-input" placeholder="••••••••••••">
        </div>

        <button type="submit" class="login-btn">
          {% if lang == 'ja' %}ログイン{% elif lang == 'en' %}Sign In{% else %}Đăng nhập{% endif %}
        </button>
      </form>

      <!-- Minimal Language Switcher -->
      <div class="login-lang-bar">
        <a href="/set-lang?lang=vi&next=/login" class="login-lang-link {% if lang == 'vi' or not lang %}active{% endif %}">Tiếng Việt</a>
        <span style="color: #cbd5e1;">|</span>
        <a href="/set-lang?lang=en&next=/login" class="login-lang-link {% if lang == 'en' %}active{% endif %}">English</a>
        <span style="color: #cbd5e1;">|</span>
        <a href="/set-lang?lang=ja&next=/login" class="login-lang-link {% if lang == 'ja' %}active{% endif %}">日本語</a>
      </div>
    </div>

    <div class="login-footer-text">
      Internal Operational Utility (GMT+7)
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Workstation Access Log | Tokuyama Vietnam</title>
  <link rel="stylesheet" href="/static/css/swiss_theme.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f4f6fa;
      padding: 24px;
    }
    .toku-login-card {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }
    .toku-masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .toku-dept-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #526071;
    }
    .toku-page-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin: 0 0 8px 0;
    }
  </style>
</head>
<body>
  <div class="toku-login-card">
    <!-- Masthead: Logo on left, Department on right -->
    <div class="toku-masthead">
      <svg width="175" height="34" viewBox="0 0 200 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="0" y="27" font-family="'Inter', sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="0.02em">TOKUYAMA</text>
        <line x1="162" y1="13" x2="182" y2="13" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="162" y1="13" x2="172" y2="28" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="182" y1="13" x2="172" y2="28" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="162" cy="13" r="6" fill="#FFFFFF" stroke="#005BAC" stroke-width="3"/>
        <circle cx="182" cy="13" r="6" fill="#FFFFFF" stroke="#1A365D" stroke-width="3"/>
        <circle cx="172" cy="28" r="6" fill="#FFFFFF" stroke="#FF6B00" stroke-width="3"/>
      </svg>
      <div class="toku-dept-text">IT DEPARTMENT • WORKSTATION 01</div>
    </div>

    <!-- Title & Warning Strip -->
    <h1 class="toku-page-title">Shared Workstation Access Log</h1>
    <div class="toku-warning-strip" style="background: #fffbeb; border: 1px solid #fde68a; color: #92400e; margin-bottom: 24px;">
      ⚠️ Warning: Active session running by HOANG VAN CANH
    </div>

    {% if error %}
    <div style="background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 12px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 20px;">
      {{ error }}
    </div>
    {% endif %}

    <!-- Login Form matching anhtheme.jpg inputs and buttons -->
    <form method="post" action="/login">
      <div class="toku-form-group">
        <label class="toku-label">Operator Name <span class="required">*</span></label>
        <input type="text" name="username" required autofocus class="toku-input" placeholder="e.g., admin or employee ID">
      </div>

      <div class="toku-form-group" style="margin-bottom: 28px;">
        <label class="toku-label">Access Credential / Password <span class="required">*</span></label>
        <input type="password" name="password" required class="toku-input" placeholder="Enter password (e.g. tokuadmin2026)">
      </div>

      <!-- Action Buttons: ▶ Start Session & ■ End Session -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
        <button type="submit" class="btn-primary" style="width: 100%;">
          ▶ Start Session
        </button>
        <button type="reset" class="btn-secondary" style="width: 100%;">
          ■ End Session
        </button>
      </div>
    </form>
  </div>

  <div class="toku-footer" style="margin-top: 24px;">
    Tokuyama Vietnam Co., Ltd. • Internal Operational Utility (GMT+7)
  </div>
</body>
</html>

{% extends "sqladmin/base.html" %}
{% block body %}
<style>
  body {
    background-color: #f4f6fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .toku-login-card {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    background: #ffffff;
    max-width: 440px;
    width: 100%;
  }
  .toku-btn-login {
    background-color: #4D5CB0 !important;
    border-color: #4D5CB0 !important;
    color: #ffffff !important;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 6px;
    transition: background-color 0.15s ease;
  }
  .toku-btn-login:hover {
    background-color: #3E4A96 !important;
    border-color: #3E4A96 !important;
  }
  .form-control:focus {
    border-color: #8C9BF0 !important;
    box-shadow: 0 0 0 0.25rem rgba(77, 92, 176, 0.2) !important;
  }
</style>

<div class="d-flex align-items-center justify-content-center vh-100 p-3">
  <form class="card toku-login-card" action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        {% if admin.logo_url %}
        <img src="{{ admin.logo_url }}" alt="{{ admin.title }}" style="max-height: 48px; max-width: 220px; object-fit: contain; margin-bottom: 12px;" />
        {% endif %}
        <h2 class="card-title text-center mb-1" style="color: #2A2C34; font-weight: 700; font-size: 19px;">
          Tokuyama IT Portal
        </h2>
        <p class="text-muted" style="font-size: 13px; margin: 0;">
          Đăng nhập khu vực Quản trị viên IT
        </p>
      </div>

      {% if error %}
      <div class="alert alert-danger mb-3 py-2 px-3" role="alert" style="font-size: 13px;">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
      </div>
      {% endif %}

      <div class="mb-3">
        <label class="form-label text-secondary" style="font-weight: 600; font-size: 13px;">Tên tài khoản (Username)</label>
        <input name="username" type="text" class="form-control" placeholder="Nhập tài khoản IT Admin" required autocomplete="off" autofocus>
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary" style="font-weight: 600; font-size: 13px;">Mật khẩu (Password)</label>
        <div class="input-group input-group-flat">
          <input name="password" type="password" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="off">
        </div>
      </div>

      <div class="form-footer">
        <button type="submit" class="btn toku-btn-login w-100">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng nhập Admin
        </button>
      </div>

      <div class="text-center mt-4 pt-2 border-top">
        <a href="/dashboard" class="text-decoration-none text-muted" style="font-size: 12.5px;">
          <i class="fa-solid fa-arrow-left me-1"></i> Quay lại Dashboard người dùng
        </a>
      </div>
    </div>
  </form>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="{{ current_lang or 'vi' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Hệ thống Quản lý Tài sản IT Tokuyama Vietnam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --toku-red: #C51118;
            --toku-red-hover: #A00D13;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #F8FAFC;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-slate-50">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <!-- Logo -->
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-red-600 text-white font-black text-2xl shadow-md mb-4 tracking-tighter">
            TV
        </div>
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">TOKUYAMA VIETNAM</h2>
        <p class="mt-1 text-sm text-slate-500 font-medium">Hệ thống Quản lý Tài sản IT nội bộ (ITAM)</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 sm:rounded-xl sm:px-10">
            {% if error %}
            <div class="mb-5 p-4 rounded-lg bg-red-50 border border-red-200 flex items-start space-x-3 text-sm text-red-800">
                <i class="fa-solid fa-triangle-exclamation text-red-500 mt-0.5 text-base"></i>
                <div class="flex-1 font-medium leading-relaxed">
                    {{ error }}
                </div>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        Tên đăng nhập
                    </label>
                    <div class="mt-1.5 relative rounded-md">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-user text-sm"></i>
                        </div>
                        <input id="username" name="username" type="text" autocomplete="username" required
                               value="{{ username or '' }}"
                               placeholder="VD: itadmin hoặc ninh"
                               class="block w-full pl-10 pr-3 py-2.5 sm:text-sm border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        Mật khẩu
                    </label>
                    <div class="mt-1.5 relative rounded-md">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                               placeholder="••••••••"
                               class="block w-full pl-10 pr-3 py-2.5 sm:text-sm border border-slate-300 rounded-lg text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 transition">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition">
                        Đăng nhập vào hệ thống
                    </button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <a href="/admin/login" class="text-xs text-slate-500 hover:text-slate-800 transition inline-flex items-center space-x-1">
                    <i class="fa-solid fa-sliders text-slate-400 text-[10px]"></i>
                    <span>Cổng Quản trị Kỹ thuật (IT Admin)</span>
                </a>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                <span>Bảo mật nội bộ Tokuyama</span>
                <div class="flex space-x-2">
                    <a href="/set-lang?lang=vi&next=/login" class="hover:text-slate-600">VI</a>
                    <span>•</span>
                    <a href="/set-lang?lang=en&next=/login" class="hover:text-slate-600">EN</a>
                    <span>•</span>
                    <a href="/set-lang?lang=ja&next=/login" class="hover:text-slate-600">JA</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

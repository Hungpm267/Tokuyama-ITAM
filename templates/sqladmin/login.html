{% extends "sqladmin/base.html" %}

{% block head %}
<style>
  :root {
    --toku-primary: #4D5CB0;
    --toku-primary-hover: #3E4D9D;
    --toku-orange: #FF561D;
    --toku-canvas: #f8fafc;
  }
  body {
    background-color: var(--toku-canvas) !important;
  }
  .login-card {
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
    background: #ffffff;
    max-width: 400px;
    width: 100%;
  }
  .btn-toku-primary {
    background-color: var(--toku-primary) !important;
    border-color: var(--toku-primary) !important;
    color: #ffffff !important;
    font-weight: 600;
  }
  .btn-toku-primary:hover, .btn-toku-primary:focus {
    background-color: var(--toku-primary-hover) !important;
    border-color: var(--toku-primary-hover) !important;
    color: #ffffff !important;
  }
  .password-toggle-btn {
    border: 1px solid #ced4da;
    border-left: none;
    background: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    color: #64748b;
    border-top-right-radius: 6px;
    border-bottom-right-radius: 6px;
    transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out;
  }
  .password-toggle-btn:hover {
    color: #0f172a;
    background-color: #f1f5f9;
  }
  .input-password-group input {
    border-top-right-radius: 0 !important;
    border-bottom-right-radius: 0 !important;
  }
  .form-control:focus {
    border-color: var(--toku-primary) !important;
    box-shadow: 0 0 0 0.25rem rgba(77, 92, 176, 0.2) !important;
  }
</style>
{% endblock %}

{% block body %}
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="login-card p-4">
    <div class="text-center mb-4">
      {% if admin.logo_url %}
      <img src="{{ admin.logo_url }}" alt="Tokuyama Logo" style="height: 48px; object-fit: contain;" class="mb-3">
      {% endif %}
      <h3 class="fw-bold mb-1" style="color: #0f172a;">{{ admin.title }}</h3>
      <p class="text-muted small mb-0">Hệ thống Quản lý Tài sản CNTT Tokuyama Vietnam</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 px-3 small mb-3" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form action="{{ url_for('admin:login') }}" method="POST" autocomplete="off">
      <div class="mb-3">
        <label class="form-label fw-semibold" for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" class="form-control" placeholder="Ví dụ: it.admin" required autofocus autocomplete="username">
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold" for="password">Mật khẩu</label>
        <div class="input-group input-password-group">
          <input id="password" name="password" type="password" class="form-control" placeholder="Nhập mật khẩu..." required autocomplete="current-password">
          <button class="btn password-toggle-btn" type="button" id="togglePasswordBtn" title="Hiển thị hoặc che mật khẩu" aria-label="Hiện hoặc ẩn mật khẩu">
            <!-- Icon Eye (Hiển thị) -->
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Icon Eye Off (Che mật khẩu) -->
            <svg id="eyeOffIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-footer">
        <button type="submit" class="btn btn-toku-primary w-100 py-2">
          Đăng nhập
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const passwordInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePasswordBtn");
    const eyeIcon = document.getElementById("eyeIcon");
    const eyeOffIcon = document.getElementById("eyeOffIcon");

    if (toggleBtn && passwordInput) {
      toggleBtn.addEventListener("click", function (e) {
        e.preventDefault();
        const isPassword = passwordInput.getAttribute("type") === "password";
        if (isPassword) {
          passwordInput.setAttribute("type", "text");
          eyeIcon.style.display = "none";
          eyeOffIcon.style.display = "inline-block";
          toggleBtn.setAttribute("title", "Che mật khẩu");
        } else {
          passwordInput.setAttribute("type", "password");
          eyeIcon.style.display = "inline-block";
          eyeOffIcon.style.display = "none";
          toggleBtn.setAttribute("title", "Hiển thị mật khẩu");
        }
      });
    }
  });
</script>
{% endblock %}

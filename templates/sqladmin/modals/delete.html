{% set current_lang = current_lang or get_current_lang(request) %}
<div class="modal modal-blur fade" id="modal-delete" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document" style="max-width: 460px;">
    <div class="modal-content shadow-sm" style="border: 1px solid var(--toku-border); border-radius: 20px; overflow: hidden;">
      <div class="modal-status bg-danger" style="height: 3px;"></div>
      <div class="modal-header py-3 px-4 bg-white" style="border-bottom: 1px solid var(--toku-border);">
        <h5 class="modal-title d-flex align-items-center gap-2 m-0" style="font-size: 14.5px; font-weight: 700; color: #0f172a;">
          <span style="width: 24px; height: 24px; border-radius: 50%; background-color: #fef2f2; color: #dc2626; display: inline-flex; align-items: center; justify-content: center; font-size: 12px;">
            <i class="fa-solid fa-trash-can"></i>
          </span>
          <span>{{ t('Xác nhận xóa', current_lang) }}</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-4 px-4 bg-white">
        <div id="modal-delete-text" class="text-secondary" style="font-size: 13.5px; line-height: 1.6;">
          {{ t('Bạn có chắc chắn muốn xóa bản ghi này?', current_lang) }}
        </div>
        
        <div class="mt-3">
          <label for="modal-delete-reason" class="form-label text-muted small fw-semibold mb-1">
            {{ t('Lý do xóa (tùy chọn)', current_lang) }}
          </label>
          <input type="text" id="modal-delete-reason" class="form-control form-control-sm" placeholder="{{ '管理画面から削除' if current_lang == 'ja' else ('Delete from ITAM admin' if current_lang == 'en' else 'Xóa từ giao diện quản trị ITAM') }}" style="border-color: var(--toku-border); font-size: 13px;" />
        </div>

        <div id="modal-delete-error" class="alert alert-danger py-2 px-3 mt-3 d-none small mb-0" style="border-radius: 6px;"></div>
      </div>
      <div class="modal-footer py-2 px-4 bg-light d-flex justify-content-end gap-2" style="border-top: 1px solid var(--toku-border);">
        <button type="button" class="btn btn-outline-secondary px-3 py-1 btn-sm" data-bs-dismiss="modal" style="font-size: 13px; font-weight: 600;">
          {{ t('Hủy', current_lang) }}
        </button>
        <button id="modal-delete-button" data-url="" class="btn btn-danger px-3 py-1 btn-sm" style="font-size: 13px; font-weight: 600; background-color: #dc2626; border-color: #dc2626;">
          <i class="fa-solid fa-trash me-1"></i> {{ t('Xóa', current_lang) }}
        </button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  function initDeleteModalHandler() {
    if (typeof jQuery === 'undefined') {
      setTimeout(initDeleteModalHandler, 50);
      return;
    }
    var $ = jQuery;
    
    // Gỡ bỏ listener mặc định của main.js để tránh thông báo "This will permanently delete ..."
    $(document).off('shown.bs.modal', '#modal-delete');
    $(document).off('click', '#modal-delete-button');

    var currentLang = "{{ current_lang or 'vi' }}";

    $(document).on('show.bs.modal shown.bs.modal', '#modal-delete', function(event) {
      var element = $(event.relatedTarget);
      if (!element || !element.length) {
        element = $('#action-delete');
      }

      var label = element.attr('data-label') || element.data('label');
      var name = element.data('name');
      var pk = element.data('pk');
      var url = element.data('url') || element.attr('data-url');

      $('#modal-delete-error').addClass('d-none').text('');
      $('#modal-delete-reason').val('');
      $('#modal-delete-button').prop('disabled', false).attr('data-url', url);

      var textHtml = '';
      if (label && label.length > 0) {
        if (currentLang === 'ja') {
          textHtml = '本当に <strong>' + $('<div>').text(label).html() + '</strong> を削除してもよろしいですか？';
        } else if (currentLang === 'en') {
          textHtml = 'Are you sure you want to delete <strong>' + $('<div>').text(label).html() + '</strong>?';
        } else {
          textHtml = 'Bạn có chắc chắn muốn xóa <strong>' + $('<div>').text(label).html() + '</strong>?';
        }
      } else if (Array.isArray(pk) && pk.length > 0) {
        if (currentLang === 'ja') {
          textHtml = '選択した <strong>' + pk.length + '</strong> 件のデータを削除してもよろしいですか？';
        } else if (currentLang === 'en') {
          textHtml = 'Are you sure you want to delete <strong>' + pk.length + '</strong> selected item(s)?';
        } else {
          textHtml = 'Bạn có chắc chắn muốn xóa <strong>' + pk.length + '</strong> mục đã chọn?';
        }
      } else if (name && pk) {
        if (currentLang === 'ja') {
          textHtml = '本当に <strong>' + $('<div>').text(name + ' #' + pk).html() + '</strong> を削除してもよろしいですか？';
        } else if (currentLang === 'en') {
          textHtml = 'Are you sure you want to delete <strong>' + $('<div>').text(name + ' #' + pk).html() + '</strong>?';
        } else {
          textHtml = 'Bạn có chắc chắn muốn xóa <strong>' + $('<div>').text(name + ' #' + pk).html() + '</strong>?';
        }
      } else {
        if (currentLang === 'ja') {
          textHtml = 'このデータを削除してもよろしいですか？';
        } else if (currentLang === 'en') {
          textHtml = 'Are you sure you want to delete this record?';
        } else {
          textHtml = 'Bạn có chắc chắn muốn xóa bản ghi này?';
        }
      }
      $('#modal-delete-text').html(textHtml);
    });

    $(document).on('click', '#modal-delete-button', function() {
      var btn = $(this);
      var url = btn.attr('data-url');
      if (!url) return;

      var reason = $('#modal-delete-reason').val().trim();
      if (reason) {
        url += (url.indexOf('?') >= 0 ? '&' : '?') + 'delete_reason=' + encodeURIComponent(reason);
      }

      btn.prop('disabled', true);
      $('#modal-delete-error').addClass('d-none').text('');

      $.ajax({
        url: url,
        method: 'DELETE',
        success: function(result) {
          window.location.href = result;
        },
        error: function(request, status, error) {
          btn.prop('disabled', false);
          if (request.responseJSON && request.responseJSON.detail) {
            msg = request.responseJSON.detail;
          } else if (request.responseText) {
            try {
              var parsed = JSON.parse(request.responseText);
              if (parsed.detail) msg = parsed.detail;
            } catch(e) {
              try {
                var parser = new DOMParser();
                var doc = parser.parseFromString(request.responseText, 'text/html');
                var errEl = doc.querySelector('.lead, .page-title, p, h3');
                if (errEl && errEl.textContent.trim()) {
                  msg = errEl.textContent.trim();
                } else {
                  msg = request.responseText.replace(/<[^>]*>/g, ' ').trim().slice(0, 150);
                }
              } catch(e2) {
                msg = request.responseText;
              }
            }
          }
          $('#modal-delete-error').removeClass('d-none').text(msg);
        }
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDeleteModalHandler);
  } else {
    initDeleteModalHandler();
  }
})();
</script>
